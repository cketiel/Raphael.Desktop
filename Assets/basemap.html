<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Address Map</title>

    <!--
        Served from the maps virtual host, never from a string or a file in %TEMP%. That is what
        gives the page an https origin, which is what lets the Google key be restricted by HTTP
        referrer. See MapWebViewHost on the C# side.

        The key itself arrives as window.RAPHAEL_MAPS.apiKey, injected by the host before this
        document runs, so it is in neither this file nor the URL.
    -->
    <script src="raphael-maps.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, "Segoe UI", sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #inputs {
            display: flex;
            padding: 8px 12px;
            background-color: #f0f0f0;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        #dropoff-group {
            display: none;
        }

        label {
            font-size: 12px;
            margin-bottom: 4px;
        }

        input[type="text"], input {
            padding: 6px 10px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="inputs">
            <div class="input-group">
                <label id="pickup-label" for="pickup">📍 Search address</label>
                <input id="pickup" placeholder="Ej: 123 Main St, NY" />
            </div>
            <div class="input-group" id="dropoff-group">
                <label for="dropoff">🚩 Dropoff</label>
                <input id="dropoff" placeholder="Ej: 456 Elm St, NY" />
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        let map;
        let pickupMarker, dropoffMarker;
        let pickupPosition, dropoffPosition;

        const originLat = RaphaelMaps.num('lat', 25.77427);
        const originLng = RaphaelMaps.num('lng', -80.19366);

        // The placeholder centre. Coordinates equal to it mean "nothing located yet", which is
        // why no marker is dropped for it — the same rule the previous version applied.
        const PLACEHOLDER_LAT = 25.77427;

        RaphaelMaps.ready().then(initMap).catch(error => {
            document.getElementById('map').innerHTML =
                '<p style="padding:16px;color:#a00">' + error.message + '</p>';
        });

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 5,
                center: { lat: originLat, lng: originLng }
            });

            // The shared module draws the route onto whichever map the page put here.
            window.__raphaelMap = map;

            RaphaelMaps.attachAutocomplete('pickup', onPickupChosen);
            RaphaelMaps.attachAutocomplete('dropoff', onDropoffChosen);

            if (originLat !== PLACEHOLDER_LAT) {
                setPickupMarker({ lat: originLat, lng: originLng });
            }
        }

        // ------------------------------------------------------------------ pickup

        function onPickupChosen(result) {
            pickupPosition = { lat: result.lat, lng: result.lng };

            RaphaelMaps.post({ type: 'autocomplete', result: result });

            setPickupMarker(pickupPosition);
        }

        function setPickupMarker(position) {
            if (pickupMarker) pickupMarker.setMap(null);

            pickupPosition = position;

            pickupMarker = new google.maps.Marker({
                draggable: true,
                animation: google.maps.Animation.DROP,
                position: position,
                label: 'P',
                map: map
            });

            focusMap(position, 17);
            describePickup(position);

            pickupMarker.addListener('dragend', () => {
                const moved = pickupMarker.getPosition();

                map.setCenter(moved);
                pickupPosition = moved;

                describePickup(moved);

                if (dropoffPosition) showsRoute();
            });

            pickupMarker.addListener('click', () => toggleBounce(pickupMarker));

            if (dropoffPosition) showsRoute();
        }

        /**
         * Fills the input and the WPF form from a point the dispatcher dragged a pin to.
         *
         * The address comes from the host, which serves it from our own database when anyone has
         * dropped a pin nearby before. It used to come from Google on every single drag.
         */
        async function describePickup(position) {
            const found = await RaphaelMaps.reverseGeocode(position);

            if (!found) return;

            document.getElementById('pickup').value = found.formatted_address;

            RaphaelMaps.post({ type: 'autocomplete', result: found.parts });
        }

        // ------------------------------------------------------------------ dropoff

        function onDropoffChosen(result) {
            dropoffPosition = { lat: result.lat, lng: result.lng };

            RaphaelMaps.post({
                type: 'dropoff',
                dropoff_address: result.address,
                city: result.city,
                lat: result.lat,
                lng: result.lng
            });

            setDropoffMarker(dropoffPosition);
        }

        function setDropoffMarker(position) {
            if (dropoffMarker) dropoffMarker.setMap(null);

            dropoffPosition = position;

            dropoffMarker = new google.maps.Marker({
                draggable: true,
                animation: google.maps.Animation.DROP,
                position: position,
                label: 'D',
                map: map
            });

            focusMap(position, 17);

            dropoffMarker.addListener('dragend', async () => {
                const moved = dropoffMarker.getPosition();

                map.setCenter(moved);
                dropoffPosition = moved;

                const found = await RaphaelMaps.reverseGeocode(moved);

                if (found) {
                    document.getElementById('dropoff').value = found.formatted_address;

                    RaphaelMaps.post({
                        type: 'dropoff',
                        dropoff_address: found.formatted_address,
                        city: found.parts.city,
                        lat: found.parts.lat,
                        lng: found.parts.lng
                    });
                }

                showsRoute();
            });

            dropoffMarker.addListener('click', () => toggleBounce(dropoffMarker));

            showsRoute();
        }

        // ------------------------------------------------------------------ shared

        function focusMap(position, zoomValue) {
            map.setCenter(position);
            map.setZoom(zoomValue);
        }

        function toggleBounce(marker) {
            marker.setAnimation(
                marker.getAnimation() !== null ? null : google.maps.Animation.BOUNCE);
        }

        /**
         * Asks the host for the road between the two pins.
         *
         * This used to be a DirectionsService call made here in the browser — a class Google no
         * longer serves to this Cloud project, and a request nothing cached. The host answers
         * through RaphaelMaps.showRoute.
         */
        function showsRoute() {
            if (!pickupPosition || !dropoffPosition) return;

            RaphaelMaps.clearRoute();
            RaphaelMaps.requestRoute(pickupPosition, dropoffPosition);
        }

        // ------------------------------------------------------------------ called from C#

        function showDropoff() {
            document.getElementById('dropoff-group').style.display = 'flex';
            document.getElementById('pickup-label').innerText = '📍 Pickup';
        }

        function prepareNewCustomer() {
            document.getElementById('dropoff-group').style.display = 'none';
            document.getElementById('pickup-label').innerText = '📍 Search address';

            document.getElementById('pickup').value = '';
            document.getElementById('dropoff').value = '';

            if (pickupMarker) pickupMarker.setMap(null);
            if (dropoffMarker) dropoffMarker.setMap(null);

            pickupPosition = null;
            dropoffPosition = null;

            RaphaelMaps.clearRoute();

            map.setCenter({ lat: originLat, lng: originLng });
            map.setZoom(5);
        }
    </script>
</body>
</html>
