<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Autocomplete Only</title>

    <!--
        A bare address field, meant to be laid over a WPF form. Nothing calls it today — the trip
        form uses the map pages instead — but it is migrated along with them rather than left
        behind: it used google.maps.places.Autocomplete, which this Cloud project cannot load, so
        the first person to switch it back on would have found a dead field and no explanation.
    -->
    <script src="raphael-maps.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: system-ui, "Segoe UI", sans-serif;
        }

        #autocompleteInput {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>
<!-- data-no-map: this page loads the API but draws no map, so it owes no Dynamic Maps load. -->
<body data-no-map="1">
    <input id="autocompleteInput" placeholder="Search address" type="text" />

    <script>
        // No map on this page, but the Places library still has to load before the field works.
        RaphaelMaps.ready().then(() => {
            RaphaelMaps.attachAutocomplete('autocompleteInput', result => {
                // This page posts the address bare, without a type, which is the shape its one
                // historical caller expected.
                RaphaelMaps.post(result);
            });
        }).catch(error => console.error(error));
    </script>
</body>
</html>
