<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Trip Route Map</title>

    <!--
        Served from the maps virtual host so the page has an https origin the Google key can be
        restricted to. The key arrives as window.RAPHAEL_MAPS.apiKey from the host, and the trip's
        coordinates as query parameters.
    -->
    <script src="raphael-maps.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, "Segoe UI", sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #inputs {
            display: flex;
            padding: 8px 12px;
            background-color: #f0f0f0;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        #dropoff-group {
            display: flex;
        }

        label {
            font-size: 12px;
            margin-bottom: 4px;
        }

        input[type="text"], input {
            padding: 6px 10px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="inputs">
            <div class="input-group">
                <label id="pickup-label" for="pickup">📍 Pickup</label>
                <input id="pickup" placeholder="Ej: 123 Main St, NY" />
            </div>
            <div class="input-group" id="dropoff-group">
                <label for="dropoff">🚩 Dropoff</label>
                <input id="dropoff" placeholder="Ej: 456 Elm St, NY" />
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        let map;
        let pickupMarker, dropoffMarker;
        let pickupPosition, dropoffPosition;

        const originLat = RaphaelMaps.num('lat', NaN);
        const originLng = RaphaelMaps.num('lng', NaN);
        const destinationLat = RaphaelMaps.num('dlat', NaN);
        const destinationLng = RaphaelMaps.num('dlng', NaN);

        const PLACEHOLDER_LAT = 25.77427;

        RaphaelMaps.ready().then(initMap).catch(error => {
            document.getElementById('map').innerHTML =
                '<p style="padding:16px;color:#a00">' + error.message + '</p>';
        });

        function initMap() {
            const centreLat = isNaN(originLat) ? PLACEHOLDER_LAT : originLat;
            const centreLng = isNaN(originLng) ? -80.19366 : originLng;

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 5,
                center: { lat: centreLat, lng: centreLng }
            });

            window.__raphaelMap = map;

            RaphaelMaps.attachAutocomplete('pickup', onPickupChosen);
            RaphaelMaps.attachAutocomplete('dropoff', onDropoffChosen);

            if (!isNaN(originLat) && !isNaN(originLng) && originLat !== PLACEHOLDER_LAT) {
                setPickupMarker({ lat: originLat, lng: originLng }, false);
            }

            if (!isNaN(destinationLat) && !isNaN(destinationLng)) {
                setDropoffMarker({ lat: destinationLat, lng: destinationLng }, false);
            }
        }

        // ------------------------------------------------------------------ pickup

        function onPickupChosen(result) {
            pickupPosition = { lat: result.lat, lng: result.lng };

            RaphaelMaps.post({ type: 'autocomplete', result: result });

            setPickupMarker(pickupPosition, false);
        }

        /**
         * `describe` asks Google what address this point is, which is wanted when a dispatcher
         * drags the pin and unwanted when the trip's own address put it there.
         */
        function setPickupMarker(position, describe) {
            if (pickupMarker) pickupMarker.setMap(null);

            pickupPosition = position;

            pickupMarker = new google.maps.Marker({
                draggable: true,
                animation: google.maps.Animation.DROP,
                position: position,
                label: 'P',
                map: map
            });

            focusMap(position, 17);

            if (describe) describePickup(position);

            pickupMarker.addListener('dragend', () => {
                const moved = pickupMarker.getPosition();

                map.setCenter(moved);
                pickupPosition = moved;

                describePickup(moved);

                if (dropoffPosition) showsRoute();
            });

            pickupMarker.addListener('click', () => toggleBounce(pickupMarker));

            if (dropoffPosition) showsRoute();
        }

        /**
         * The address the host resolved for a dragged pin — from our own database when anyone
         * has dropped one nearby before, and only otherwise from Google.
         */
        async function describePickup(position) {
            const found = await RaphaelMaps.reverseGeocode(position);

            if (!found) return;

            document.getElementById('pickup').value = found.formatted_address;

            RaphaelMaps.post({ type: 'pickup', result: found.parts });
        }

        // ------------------------------------------------------------------ dropoff

        function onDropoffChosen(result) {
            dropoffPosition = { lat: result.lat, lng: result.lng };

            RaphaelMaps.post({
                type: 'dropoff',
                dropoff_address: result.address,
                city: result.city,
                lat: result.lat,
                lng: result.lng
            });

            setDropoffMarker(dropoffPosition, false);
        }

        function setDropoffMarker(position, describe) {
            if (dropoffMarker) dropoffMarker.setMap(null);

            dropoffPosition = position;

            dropoffMarker = new google.maps.Marker({
                draggable: true,
                animation: google.maps.Animation.DROP,
                position: position,
                label: 'D',
                map: map
            });

            focusMap(position, 17);

            if (describe) describeDropoff(position);

            dropoffMarker.addListener('dragend', () => {
                const moved = dropoffMarker.getPosition();

                map.setCenter(moved);
                dropoffPosition = moved;

                describeDropoff(moved);
                showsRoute();
            });

            dropoffMarker.addListener('click', () => toggleBounce(dropoffMarker));

            showsRoute();
        }

        async function describeDropoff(position) {
            const found = await RaphaelMaps.reverseGeocode(position);

            if (!found) return;

            document.getElementById('dropoff').value = found.formatted_address;

            RaphaelMaps.post({
                type: 'dropoff',
                dropoff_address: found.formatted_address,
                city: found.parts.city,
                lat: found.parts.lat,
                lng: found.parts.lng
            });
        }

        // ------------------------------------------------------------------ shared

        function focusMap(position, zoomValue) {
            map.setCenter(position);
            map.setZoom(zoomValue);
        }

        function toggleBounce(marker) {
            marker.setAnimation(
                marker.getAnimation() !== null ? null : google.maps.Animation.BOUNCE);
        }

        /**
         * The route between the two pins, drawn from what the host sends back.
         *
         * This screen used to call DirectionsService here with departureTime: new Date() and
         * trafficModel BEST_GUESS — a billed traffic request on every redraw, priced against the
         * traffic of whatever moment the dispatcher happened to open the trip. The host now asks
         * the routing proxy, which prices it against the trip's own hour and caches the answer.
         */
        function showsRoute() {
            if (!pickupPosition || !dropoffPosition) return;

            RaphaelMaps.clearRoute();
            RaphaelMaps.requestRoute(pickupPosition, dropoffPosition);
        }

        // ------------------------------------------------------------------ called from C#

        function showDropoff() {
            document.getElementById('dropoff-group').style.display = 'flex';
            document.getElementById('pickup-label').innerText = '📍 Pickup';
        }
    </script>
</body>
</html>
